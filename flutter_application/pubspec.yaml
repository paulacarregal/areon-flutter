name: flutter_application
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.11.4 <4.0.0"


dependencies:

  flutter:
    sdk: flutter
    
  carousel_slider: ^5.0.0

  cupertino_icons: ^1.0.8

  firebase_core: ^4.0.0
  firebase_auth: ^6.5.2
  cloud_firestore: ^6.5.0
  firebase_storage: ^13.0.0
  firebase_messaging: ^16.0.0
  flutter_local_notifications: ^19.4.0

  google_sign_in: ^7.0.0

  provider: ^6.1.2

  shared_preferences: ^2.5.0

  geolocator: ^14.0.0

  google_maps_flutter: ^2.12.0

  image_picker: ^1.1.2

  cached_network_image: ^3.4.1

  http: ^1.4.0
  flutter_map: ^8.3.0
  latlong2: ^0.9.1

  url_launcher: ^6.3.0
  
  # ADICIONADO: Dependência para leitura de variáveis de ambiente
  flutter_dotenv: ^5.2.1
  

dev_dependencies:
  flutter_test:
    sdk: flutter


  flutter_lints: ^6.0.0



flutter:



  uses-material-design: true

  # CONFIGURADO: Declarando o arquivo .env como asset do projeto
  assets:
    - assets/images/
    - assets/images/places/
    - .env